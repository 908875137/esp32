<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>ThinkINK</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">ThinkINK</span>
    </div>
    <div class="wifi-badge" id="wifi-badge">—</div>
  </header>

  <main id="page" class="page">
    <!-- Pages injected by app.js -->
  </main>

  <nav class="tabbar">
    <button class="tab active" data-page="home">首页</button>
    <button class="tab" data-page="images">图片</button>
    <button class="tab" data-page="quotes">语录</button>
    <button class="tab" data-page="settings">设置</button>
    <button class="tab" data-page="logs">日志</button>
    <button class="tab" data-page="files">文件</button>
  </nav>

  <script src="/js/app.js"></script>
</body>
</html>
